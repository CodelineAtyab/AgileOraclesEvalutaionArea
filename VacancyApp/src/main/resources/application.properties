spring.application.name=VacancyApp

# Load secrets from a local .env file (KEY=VALUE) using Spring Boot's built-in config import.
# Kept out of source control; falls back to OS environment variables if the file is absent.
spring.config.import=optional:file:.env[.properties]

# --- Oracle datasource (values come from .env / OS environment) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Fail fast at startup if the DB is unreachable
spring.datasource.hikari.connection-timeout=10000

# --- Slack incoming webhook ---
# Create an Incoming Webhook in your Slack workspace and put its URL in .env.
slack.url=${SLACK_WEBHOOK_URL:}
# Set SLACK_ENABLED=false to run without sending anything to Slack (messages are logged instead).
slack.enabled=${SLACK_ENABLED:true}

# --- Reporting schedule (milliseconds) ---
# Poll Oracle every 5 minutes; build the two Slack reports every 15 minutes.
reporting.poll-rate-ms=300000
reporting.report-rate-ms=900000
# Pending-notification count that forces an immediate digest send.
reporting.notification-threshold=7
