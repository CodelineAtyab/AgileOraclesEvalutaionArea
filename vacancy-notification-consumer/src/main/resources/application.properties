spring.application.name=vacancy-notification-consumer
spring.config.import=optional:file:vacancy-notification-consumer/.env[.properties],optional:file:.env[.properties]

# These values come from environment variables so credentials are not stored in code.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Slack incoming webhook used to send each notification message.
slack.webhook.url=${SLACK_WEBHOOK_URL}

# This app is a command-line consumer, not a web server.
spring.main.web-application-type=none
