# -------------------------------------------------------------------------
# Consumer configuration.
#
# Every value here is a placeholder that resolves from an environment
# variable at runtime (${VAR}, with no fallback default). Nothing sensitive
# is committed in source — this satisfies the brief's "Credentials in
# configuration, never in code." Because there is no default, Spring fails
# fast at startup with a clear "could not resolve placeholder" error if any
# of these variables isn't set — a missing variable never silently connects
# to the wrong database or posts to the wrong place.
#
# Example run:
#   export DB_URL="jdbc:oracle:thin:@//localhost:1521/freepdb1"
#   export DB_USERNAME="vacancyloop"
#   export DB_PASSWORD="********"
#   export SLACK_WEBHOOK_URL="https://hooks.slack.com/services/XXX/YYY/ZZZ"
#   mvn spring-boot:run
# -------------------------------------------------------------------------

# --- Oracle datasource ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# --- Slack ---
slack.webhook-url=${SLACK_WEBHOOK_URL}

# --- Keep the one-shot run quiet and clean ---
spring.main.banner-mode=off
logging.level.org.springframework=WARN
logging.level.com.vacancyloop=INFO
