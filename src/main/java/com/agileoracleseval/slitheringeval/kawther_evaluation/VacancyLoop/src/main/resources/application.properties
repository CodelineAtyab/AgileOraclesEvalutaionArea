# ============================================================
# Credentials live here, never in code (ground rule from the brief).
# Fill in your own values before running.
# ============================================================

# Same database you have been using in SQL Developer.
# Default values match a standard Oracle Database Free install.
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=REPLACE_WITH_YOUR_DB_USERNAME
spring.datasource.password=REPLACE_WITH_YOUR_DB_PASSWORD
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Slack incoming webhook URL (Slack -> Apps -> Incoming Webhooks).
# Placeholder until you have a real one - the app still runs and simply
# logs that it could not reach Slack if this is left unset.
slack.webhook.url=REPLACE_WITH_YOUR_SLACK_WEBHOOK_URL

# This is a run-once batch job, not a web service - no need for an
# embedded web server, and no banner clutter in the console output.
spring.main.web-application-type=none
spring.main.banner-mode=off
