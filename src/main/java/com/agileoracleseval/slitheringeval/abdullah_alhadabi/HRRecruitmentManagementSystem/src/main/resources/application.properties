# Values may be overridden with environment variables. DB_PASSWORD has no default.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1523/FREEPDB1}
spring.datasource.username=${DB_USERNAME:HR_RECRUITMENT}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Slack webhook URL. Leave unset only when running tests; the application validates it at startup.
slack.webhook-url=${SLACK_WEBHOOK_URL:}
notification.check-interval-ms=60000
